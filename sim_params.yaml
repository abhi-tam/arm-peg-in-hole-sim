# Environment & Infrastructure Configuration

sim:
  engine: "mujoco"
  timestep_s: 0.002          # 500 Hz physics step (16-17 substeps per 30 Hz control step)
  control_hz: 30             # Required by assignment spec
  max_episode_s: 20.0        # Required timeout
  solver: "Newton"
  solver_iterations: 50

robot:
  model_path: "assets/SO101/so101_new_calib_camera.xml"
  base_pos_m: [0.0, 0.0, 0.0]
  gripper_closed_cmd: 0.0
  gripper_open_cmd: 100.0

scene:
  hole_block:
    size_m: [0.050, 0.050, 0.030]     # 50 x 50 x 30 mm
    center_pos_m: [0.220, 0.0, 0.015] # Centered at x=220 mm, y=0, resting on z=0 table
    hole_depth_m: 0.025               # 25 mm blind hole
  peg:
    diameter_m: 0.020                 # 20 mm diameter
    length_m: 0.050                   # 50 mm long
    density_kg_m3: 1240.0             # PLA density (~19.5 g)
  default_radial_clearance_mm: 1.5
  start_state:
    peg_top_behind_gripper_site_m: 0.015
    peg_tip_in_front_gripper_site_m: 0.035
    peg_tip_above_hole_m: 0.015
    peg_tip_x_offset_from_hole_m: -0.030  # 30 mm closer to arm
  success_insertion_depth_mm: 20.0

contact:
  peg_hole_friction: 0.5     # Required by spec
  peg_gripper_friction: 0.8  # Required by spec
  table_friction: 0.6        # Reasonable tabletop friction (e.g., matte laminate/wood)
  solref: [0.004, 1.0]       # Stiff, critically damped contact to prevent peg penetration
  solimp: [0.95, 0.99, 0.001]

cameras:
  width: 640
  height: 480
  wrist:
    body: "wrist_camera"
    pos: [0.0, 0.0, 0.0]
    xyaxes: [1, 0, 0, 0, -1, 0]
    fovy: 73.7
  overhead:
    pos: [0.22, 0.0, 0.45]
    xyaxes: [0, 1, 0, 1, 0, 0]
    fovy: 55.4

domain_randomization:
  peg_mass_scale: [0.85, 1.15]
  peg_hole_friction_range: [0.3, 0.8]
  peg_in_gripper:
    dx_mm: [-1.5, 1.5]
    dy_mm: [-1.5, 1.5]
    dz_mm: [-2.0, 2.0]
    tilt_deg: [-2.0, 2.0]
  hole_offset_mm:
    x: [-10.0, 10.0]
    y: [-10.0, 10.0]
  lighting:
    intensity: [0.6, 1.4]
    azimuth_deg: [-180.0, 180.0]
    elevation_deg: [30.0, 85.0]
    color_temp_k: [3500, 6500]
  camera_offset:
    pos_mm: [-3.0, 3.0]
    rot_deg: [-1.5, 1.5]