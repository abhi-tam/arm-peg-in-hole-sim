# sim_params.yaml: single source of truth for sim, contact, and randomization.
sim:
  engine: mujoco
  control_hz: 30            # required by spec
  substeps: 20              # timestep = 1/(30*20) = 1/600 s (derived in code, never hand-typed)
  solver: Newton
  iterations: 50
  cone: elliptic
  impratio: 10
  max_episode_s: 20.0
  render_width: 640
  render_height: 480

robot:
  model_path: assets/SO101/so101_new_calib_camera.xml
  gripperframe_site: gripperframe
  wrist_camera_body: wrist_camera
  gripper_pad_geoms: []     # FILL after running scripts/inspect_arm.py (Step 3.3)

scene:
  table:
    half_size_m: [0.6, 0.6, 0.02]      # top surface at z = 0
  hole_block:
    center_xy_m: [0.220, 0.0]
    size_m: [0.050, 0.050, 0.030]
    hole_depth_m: 0.025
    ring_segments: 48                  # round hole approximated by 48 convex wedges
  peg:
    radius_m: 0.010
    length_m: 0.050
    density_kg_m3: 1240.0              # PLA, about 19.5 g
    default_radial_clearance_mm: 1.5
  start_state:
    peg_top_behind_site_m: 0.015
    peg_tip_ahead_of_site_m: 0.035
    peg_tip_above_opening_m: 0.015
    peg_tip_x_offset_from_hole_m: -0.030
  success_depth_mm: 20.0

contact:
  peg_hole_friction: 0.5     # required by spec
  peg_gripper_friction: 0.8  # required by spec
  peg_friction: 0.5          # base value on the peg geom (see priority note in scene.py)
  table_friction: 0.6        # my choice: matte workbench
  torsional: 0.005
  rolling: 0.0001
  solref: [0.004, 1.0]       # timeconst 4 ms >= 2*dt (3.33 ms), MuJoCo's stability rule
  solimp: [0.95, 0.99, 0.001]
  hole_condim: 3
  pad_condim: 4              # torsional friction helps pads resist peg twisting

cameras:
  wrist:
    xyaxes: [1, 0, 0, 0, -1, 0]
    fovy: 73.7
  overhead:
    pos: [0.22, 0.0, 0.45]
    xyaxes: [0, -1, 0, 1, 0, 0]        # spec string; looks straight down, +x up in image
    fovy: 55.4

# STARTING ranges: revisit after you see where the demonstrator breaks (log in notes.md).
domain_randomization:
  radial_clearance_mm: [1.0, 2.0]
  peg_mass_scale: [0.85, 1.15]
  peg_hole_friction: [0.3, 0.8]
  peg_in_gripper: {dx_mm: [-1.5, 1.5], dy_mm: [-1.5, 1.5], dz_mm: [-2.0, 2.0], tilt_deg: [-2.0, 2.0]}
  hole_offset_mm: {x: [-10, 10], y: [-10, 10]}
  lighting: {intensity: [0.6, 1.4], azimuth_deg: [-180, 180], elevation_deg: [30, 85], color_temp_K: [3500, 6500]}
  camera_offset: {pos_mm: [-3, 3], rot_deg: [-1.5, 1.5]}
EOF